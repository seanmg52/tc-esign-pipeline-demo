<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">Offline T&amp;C pipeline MVP</title>
  <desc id="desc">User CSV flows through local parse and validation, readiness records, deterministic gates, clean records and exception queue, then local downloadable drafts, chase tracker, exception report, and evidence manifest.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <radialGradient id="glowA" cx="18%" cy="12%" r="38%">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="75%" cy="8%" r="36%">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#334155" flood-opacity="0.16"/>
    </filter>
    <style>
      .canvas{fill:url(#bg)}.glowA{fill:url(#glowA)}.glowB{fill:url(#glowB)}.grid{stroke:rgba(59,130,246,.07);stroke-width:1}.chrome{fill:rgba(255,255,255,.78);stroke:rgba(99,102,241,.16);stroke-width:1}.dotR{fill:#fb7185}.dotY{fill:#facc15}.dotG{fill:#34d399}.muted{fill:#64748b;font:800 13px Inter,Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}.title{fill:#172033;font:800 17px Inter,Arial,sans-serif}.body{fill:#475569;font:600 13px Inter,Arial,sans-serif}.node{fill:rgba(255,255,255,.94);stroke:rgba(99,102,241,.16);stroke-width:1.2;filter:url(#shadow)}.source{stroke:#60a5fa;stroke-opacity:.5}.compute{stroke:#14b8a6;stroke-opacity:.55}.records{stroke:#a78bfa;stroke-opacity:.62}.gate{stroke:#94a3b8;stroke-opacity:.4}.clean{stroke:#22c55e;stroke-opacity:.65}.exception{stroke:#fb7185;stroke-opacity:.65}.output{stroke:#fb923c;stroke-opacity:.62}.edge{fill:none;stroke:#2563eb;stroke-width:2.2;stroke-linecap:round;marker-end:url(#arrow);opacity:.76}.small{fill:#0f766e;font:800 11px Inter,Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}
    </style>
  </defs>
  <rect class="canvas" width="1280" height="620" rx="32"/>
  <rect class="glowA" width="1280" height="620" rx="32"/>
  <rect class="glowB" width="1280" height="620" rx="32"/>
  <path class="grid" d="M80 0V620M160 0V620M240 0V620M320 0V620M400 0V620M480 0V620M560 0V620M640 0V620M720 0V620M800 0V620M880 0V620M960 0V620M1040 0V620M1120 0V620M1200 0V620M0 80H1280M0 160H1280M0 240H1280M0 320H1280M0 400H1280M0 480H1280M0 560H1280"/>
  <rect class="chrome" x="42" y="34" width="1196" height="54" rx="18"/>
  <circle class="dotR" cx="70" cy="61" r="6"/><circle class="dotY" cx="91" cy="61" r="6"/><circle class="dotG" cx="112" cy="61" r="6"/>
  <text class="title" x="150" y="67">Offline T&amp;C pipeline MVP</text>
  <text class="small" x="1055" y="66">local BYO-data</text>

  <path class="edge" d="M198 304H270"/>
  <path class="edge" d="M430 304H502"/>
  <path class="edge" d="M662 304H734"/>
  <path class="edge" d="M894 274C936 274 946 224 990 212"/>
  <path class="edge" d="M894 334C936 334 946 392 990 406"/>
  <path class="edge" d="M1112 170C1144 170 1154 150 1186 142"/>
  <path class="edge" d="M1112 240C1144 240 1154 256 1186 262"/>
  <path class="edge" d="M1112 368C1144 368 1154 378 1186 382"/>
  <path class="edge" d="M1112 446C1144 446 1154 468 1186 478"/>

  <g transform="translate(58 224)">
    <rect class="node source" width="170" height="160" rx="22"/>
    <text class="muted" x="20" y="32">Input</text>
    <text class="title" x="20" y="62">User CSV</text>
    <text class="body" x="20" y="92">Paste or upload</text>
    <text class="body" x="20" y="113">local readiness</text>
    <text class="body" x="20" y="134">data.</text>
  </g>
  <g transform="translate(270 232)">
    <rect class="node compute" width="190" height="144" rx="22"/>
    <text class="muted" x="20" y="32">Parse</text>
    <text class="title" x="20" y="62">Parse / validate</text>
    <text class="body" x="20" y="92">Check required</text>
    <text class="body" x="20" y="113">columns and</text>
    <text class="body" x="20" y="134">allowed values.</text>
  </g>
  <g transform="translate(502 232)">
    <rect class="node records" width="190" height="144" rx="22"/>
    <text class="muted" x="20" y="32">Normalize</text>
    <text class="title" x="20" y="62">Readiness records</text>
    <text class="body" x="20" y="92">One structured</text>
    <text class="body" x="20" y="113">record per</text>
    <text class="body" x="20" y="134">account.</text>
  </g>
  <g transform="translate(734 170)">
    <rect class="node gate" width="190" height="92" rx="18"/>
    <text class="muted" x="18" y="30">Gate A</text>
    <text class="title" x="18" y="58">Entity / PPSR</text>
  </g>
  <g transform="translate(734 278)">
    <rect class="node gate" width="190" height="92" rx="18"/>
    <text class="muted" x="18" y="30">Gate B</text>
    <text class="title" x="18" y="58">Signer authority</text>
  </g>
  <g transform="translate(734 386)">
    <rect class="node gate" width="190" height="92" rx="18"/>
    <text class="muted" x="18" y="30">Gate C</text>
    <text class="title" x="18" y="58">T&amp;C package</text>
  </g>
  <g transform="translate(990 126)">
    <rect class="node clean" width="170" height="116" rx="22"/>
    <text class="muted" x="20" y="32">Clear path</text>
    <text class="title" x="20" y="62">Clean records</text>
    <text class="body" x="20" y="92">Ready for local</text>
    <text class="body" x="20" y="113">draft output.</text>
  </g>
  <g transform="translate(990 360)">
    <rect class="node exception" width="170" height="116" rx="22"/>
    <text class="muted" x="20" y="32">Review path</text>
    <text class="title" x="20" y="62">Exception queue</text>
    <text class="body" x="20" y="92">Flags, negotiation,</text>
    <text class="body" x="20" y="113">wet ink, refusal.</text>
  </g>
  <g transform="translate(1186 104)">
    <rect class="node output" width="70" height="74" rx="16"/>
    <text class="title" x="14" y="32">Drafts</text>
    <text class="body" x="14" y="54">HTML</text>
  </g>
  <g transform="translate(1186 224)">
    <rect class="node output" width="70" height="74" rx="16"/>
    <text class="title" x="14" y="32">Chase</text>
    <text class="body" x="14" y="54">CSV</text>
  </g>
  <g transform="translate(1186 344)">
    <rect class="node output" width="70" height="74" rx="16"/>
    <text class="title" x="14" y="32">Report</text>
    <text class="body" x="14" y="54">CSV</text>
  </g>
  <g transform="translate(1186 464)">
    <rect class="node output" width="70" height="74" rx="16"/>
    <text class="title" x="14" y="32">Manifest</text>
    <text class="body" x="14" y="54">CSV</text>
  </g>
</svg>
