<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 760" role="img" aria-labelledby="title desc">
  <title id="title">Application pipeline for the T&amp;C e-sign demo</title>
  <desc id="desc">A hand-drawn-style flow chart showing synthetic readiness records flowing through evaluateCampaign, three gates, disposition classification, summary aggregation, and React rendering.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3c4353"/>
    </marker>
    <style>
      .bg{fill:#fbf8ef}.flow{fill:none;stroke:#3c4353;stroke-linecap:round;stroke-width:2;marker-end:url(#arrow);opacity:.72}.thin{stroke-width:1.5;opacity:.45}.owned{fill:rgba(251,244,159,.42);stroke:rgba(167,152,55,.45)}.diamond,.note{stroke:rgba(31,41,55,.18);stroke-width:2}.lav{fill:#ddd9fb}.gray{fill:#e7e7e7}.blue{fill:#e6edff}.green{fill:#bde7d4}.orange{fill:#ffd7bf}.white{fill:#f7f7f7}.txt{fill:#172033;font:700 15px Inter,Arial,sans-serif}.zone{fill:#716823;font:800 15px Inter,Arial,sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1040" height="760"/>
  <rect class="owned" x="32" y="160" width="976" height="376" rx="10"/>
  <text class="zone" x="56" y="194">runtime data pipeline inside this demo app</text>
  <path class="flow" d="M145 300 C205 300 220 300 270 300"/>
  <path class="flow" d="M430 300 C484 300 502 250 548 250"/>
  <path class="flow" d="M430 300 C484 300 502 300 548 300"/>
  <path class="flow" d="M430 300 C484 300 502 350 548 350"/>
  <path class="flow" d="M680 250 C720 250 730 286 760 320"/>
  <path class="flow" d="M680 300 C724 300 730 308 760 330"/>
  <path class="flow" d="M680 350 C720 350 730 344 760 340"/>
  <path class="flow" d="M860 330 C910 330 920 270 944 240"/>
  <path class="flow" d="M860 330 C920 330 930 330 944 330"/>
  <path class="flow" d="M860 330 C910 330 920 390 944 422"/>
  <path class="flow thin" d="M360 470 C490 620 665 620 800 470"/>
  <path class="flow thin" d="M225 620 C370 690 640 690 820 620"/>
  <g transform="translate(130 300)"><rect class="note blue" x="-108" y="-64" width="216" height="128" rx="8"/><text class="txt" text-anchor="middle"><tspan x="0" y="-28">sampleRecords.ts</tspan><tspan x="0" y="-6">synthetic readiness</tspan><tspan x="0" y="14">records only</tspan><tspan x="0" y="36">no live integrations</tspan></text></g>
  <g transform="translate(350 300)"><rect class="note green" x="-96" y="-58" width="192" height="116" rx="8"/><text class="txt" text-anchor="middle"><tspan x="0" y="-22">evaluateCampaign()</tspan><tspan x="0" y="0">maps each record</tspan><tspan x="0" y="20">through evaluateRecord()</tspan><tspan x="0" y="40">then counts summary</tspan></text></g>
  <g transform="translate(610 250)"><rect class="note white" x="-92" y="-36" width="184" height="72" rx="8"/><text class="txt" text-anchor="middle"><tspan x="0" y="-8">Debtor / PPSR gate</tspan><tspan x="0" y="14">entity + PPSR match</tspan></text></g>
  <g transform="translate(610 300)"><rect class="note white" x="-92" y="-36" width="184" height="72" rx="8"/><text class="txt" text-anchor="middle"><tspan x="0" y="-8">Authority gate</tspan><tspan x="0" y="14">signer + delivery proof</tspan></text></g>
  <g transform="translate(610 350)"><rect class="note white" x="-92" y="-36" width="184" height="72" rx="8"/><text class="txt" text-anchor="middle"><tspan x="0" y="-8">Agreement gate</tspan><tspan x="0" y="14">terms + e-sign path</tspan></text></g>
  <g transform="translate(815 330)"><polygon class="diamond lav" points="0,-82 96,0 0,82 -96,0"/><text class="txt" text-anchor="middle"><tspan x="0" y="-28">chooseDisposition()</tspan><tspan x="0" y="-6">gate flag?</tspan><tspan x="0" y="14">customer response?</tspan><tspan x="0" y="34">final state</tspan></text></g>
  <g transform="translate(945 240)"><rect class="note orange" x="-82" y="-38" width="164" height="76" rx="8"/><text class="txt" text-anchor="middle"><tspan x="0" y="-8">summary cards</tspan><tspan x="0" y="14">counts by disposition</tspan></text></g>
  <g transform="translate(945 330)"><rect class="note orange" x="-82" y="-38" width="164" height="76" rx="8"/><text class="txt" text-anchor="middle"><tspan x="0" y="-8">record cards</tspan><tspan x="0" y="14">gates + findings</tspan></text></g>
  <g transform="translate(945 422)"><rect class="note orange" x="-82" y="-38" width="164" height="76" rx="8"/><text class="txt" text-anchor="middle"><tspan x="0" y="-8">pipeline SVG</tspan><tspan x="0" y="14">this visual layer</tspan></text></g>
  <g transform="translate(360 470)"><rect class="note gray" x="-116" y="-34" width="232" height="68" rx="8"/><text class="txt" text-anchor="middle"><tspan x="0" y="-8">pipeline.test.ts</tspan><tspan x="0" y="12">verifies evaluator behavior</tspan></text></g>
  <g transform="translate(800 470)"><rect class="note gray" x="-116" y="-34" width="232" height="68" rx="8"/><text class="txt" text-anchor="middle"><tspan x="0" y="-8">React render</tspan><tspan x="0" y="12">App.tsx + styles.css</tspan></text></g>
  <g transform="translate(225 620)"><rect class="note blue" x="-116" y="-42" width="232" height="84" rx="8"/><text class="txt" text-anchor="middle"><tspan x="0" y="-14">GitHub push</tspan><tspan x="0" y="8">deploy.yml runs npm ci,</tspan><tspan x="0" y="30">tests, build</tspan></text></g>
  <g transform="translate(820 620)"><rect class="note green" x="-116" y="-42" width="232" height="84" rx="8"/><text class="txt" text-anchor="middle"><tspan x="0" y="-14">GitHub Pages</tspan><tspan x="0" y="8">serves dist/ at the</tspan><tspan x="0" y="30">public demo URL</tspan></text></g>
</svg>
